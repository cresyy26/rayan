<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1110">
  <meta name="description" content="رسالة حبّ من القلب إلى ريان، وسؤال العمر.">
  <title>ريان، هل تتزوجينني؟</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Amiri", Georgia, serif;
      --ink: #f8f2e6;
      --muted: #b8b7aa;
      --gold: #d7bd83;
      --gold-soft: #f0dfb6;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #0b1110;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 5%, rgb(91 105 73 / 20%), transparent 45%),
        radial-gradient(ellipse at 90% 95%, rgb(131 102 51 / 12%), transparent 38%),
        linear-gradient(155deg, #0b1110 0%, #121a17 48%, #0a100f 100%);
    }

    body::before,
    body::after {
      position: fixed;
      z-index: 0;
      width: 260px;
      height: 260px;
      border: 1px solid rgb(215 189 131 / 9%);
      border-radius: 50%;
      content: "";
      pointer-events: none;
    }

    body::before {
      top: -155px;
      right: -90px;
      box-shadow: 0 0 0 34px rgb(215 189 131 / 3%), 0 0 0 68px rgb(215 189 131 / 2%);
    }

    body::after {
      bottom: -170px;
      left: -110px;
      width: 320px;
      height: 320px;
      box-shadow: 0 0 0 42px rgb(215 189 131 / 3%);
    }

    .page {
      position: relative;
      z-index: 1;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding:
        max(24px, calc(var(--safe-top) + 18px))
        max(20px, calc(var(--safe-right) + 18px))
        max(24px, calc(var(--safe-bottom) + 18px))
        max(20px, calc(var(--safe-left) + 18px));
    }

    .card {
      position: relative;
      width: min(100%, 460px);
      padding: clamp(34px, 9vw, 54px) clamp(24px, 8vw, 46px) 40px;
      overflow: hidden;
      border: 1px solid rgb(215 189 131 / 28%);
      border-radius: 220px 220px 30px 30px;
      background:
        linear-gradient(180deg, rgb(255 255 255 / 4%), transparent 32%),
        linear-gradient(145deg, rgb(26 34 29 / 95%), rgb(15 22 19 / 97%));
      box-shadow: 0 30px 100px rgb(0 0 0 / 48%), inset 0 0 0 7px rgb(215 189 131 / 4%);
      -webkit-backdrop-filter: blur(24px);
      backdrop-filter: blur(24px);
      text-align: center;
      animation: arrive 850ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .card::before {
      position: absolute;
      inset: 12px;
      border: 1px solid rgb(215 189 131 / 14%);
      border-radius: 210px 210px 22px 22px;
      content: "";
      pointer-events: none;
    }

    .eyebrow {
      margin: 0 0 25px;
      color: var(--gold);
      font-size: 17px;
      letter-spacing: .04em;
    }

    .heart-mark {
      display: grid;
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      place-items: center;
      border: 1px solid rgb(215 189 131 / 42%);
      border-radius: 50%;
      background: radial-gradient(circle, rgb(215 189 131 / 12%), transparent 70%);
      color: var(--gold-soft);
      font-size: 29px;
      box-shadow: 0 0 42px rgb(215 189 131 / 12%);
    }

    h1 {
      margin: 0;
      font-family: "Amiri", Georgia, serif;
      font-size: clamp(38px, 10vw, 54px);
      font-weight: 700;
      line-height: 1.55;
      text-wrap: balance;
    }

    .name {
      display: block;
      margin-bottom: 8px;
      color: var(--gold-soft);
      font-size: clamp(31px, 8vw, 40px);
      font-weight: 400;
      line-height: 1.3;
    }

    .question-ar {
      display: block;
      direction: rtl;
      color: #fffaf0;
    }

    .note {
      margin: 16px 0 32px;
      color: var(--muted);
      font-size: 19px;
      line-height: 1.9;
    }

    .actions {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }

    .button {
      min-width: 122px;
      min-height: 58px;
      padding: 12px 26px;
      border: 1px solid transparent;
      border-radius: 18px;
      color: var(--ink);
      font: inherit;
      font-family: "Amiri", Georgia, serif;
      font-size: 23px;
      line-height: 1;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      cursor: pointer;
    }

    .button:active {
      transform: scale(.97);
    }

    .button:focus-visible {
      outline: 3px solid var(--gold-soft);
      outline-offset: 4px;
    }

    .yes {
      border-color: #e7d4a7;
      background: linear-gradient(135deg, #e4d1a2, #c2a866);
      color: #17170f;
      font-weight: 700;
      box-shadow: 0 9px 28px rgb(195 168 102 / 22%), inset 0 1px 0 rgb(255 255 255 / 50%);
    }

    .yes:hover {
      background: linear-gradient(135deg, #f1e2bd, #d5bd80);
      transform: translateY(-2px);
    }

    .no {
      border-color: rgb(215 189 131 / 30%);
      background: rgb(255 255 255 / 3%);
      color: #ded8c9;
    }

    .no:hover {
      background: rgb(215 189 131 / 10%);
    }

    .hint {
      margin: 24px 0 0;
      color: #a9a897;
      font-size: 15px;
    }

    .success {
      animation: arrive 650ms cubic-bezier(.2, .8, .2, 1) both;
    }

    .success[hidden],
    .proposal[hidden] {
      display: none;
    }

    .success h2 {
      margin: 0;
      color: #fffaf0;
      font-family: "Amiri", Georgia, serif;
      font-size: clamp(32px, 8.5vw, 43px);
      font-weight: 700;
      line-height: 1.55;
    }

    .success-message {
      display: block;
      direction: rtl;
    }

    .celebration {
      margin: 15px 0 0;
      font-size: clamp(28px, 8vw, 36px);
      letter-spacing: .12em;
      animation: float 2.4s ease-in-out infinite;
    }

    .music-retry {
      display: inline-block;
      margin-top: 18px;
      padding: 9px 18px;
      border: 1px solid rgb(215 189 131 / 45%);
      border-radius: 14px;
      background: rgb(215 189 131 / 8%);
      color: var(--gold-soft);
      font: inherit;
      font-size: 17px;
      touch-action: manipulation;
      cursor: pointer;
    }

    .music-retry[hidden] {
      display: none;
    }

    .canvas {
      position: fixed;
      z-index: 3;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .no.is-escaping {
      position: fixed;
      z-index: 4;
      margin: 0;
      transform: none;
      transition: left 180ms ease, top 180ms ease;
    }

    .ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 23px auto 0;
      color: var(--gold);
      font-size: 13px;
    }

    .ornament::before,
    .ornament::after {
      width: 34px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgb(215 189 131 / 60%));
      content: "";
    }

    .ornament::after {
      transform: rotate(180deg);
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @media (max-width: 360px) {
      .actions { gap: 8px; }
      .button { min-width: 108px; padding-inline: 18px; }
      .card { border-radius: 180px 180px 26px 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <canvas class="canvas" id="confetti" aria-hidden="true"></canvas>
  <audio id="ourSong" preload="auto" playsinline aria-hidden="true">
    <source src="music.mp3" type="audio/mpeg">
  </audio>
  <main class="page">
    <section class="card" aria-live="polite">
      <div class="heart-mark" aria-hidden="true">♡</div>
      <p class="eyebrow">رسالة من قلبٍ بعيد</p>

      <div class="proposal" id="proposal">
        <h1>
          <span class="name">ريان،</span>
          <span class="question-ar" lang="ar">هل تتزوجينني؟</span>
        </h1>
        <p class="note">مهما ابتعدت بيننا المسافات،<br>سيبقى قلبي بقربكِ دائماً.</p>
        <div class="actions">
          <button class="button yes" id="yesButton" type="button">نعم</button>
          <button class="button no" id="noButton" type="button" aria-label="لا">لا</button>
        </div>
        <div class="ornament" aria-hidden="true">✦</div>
        <p class="hint">المسافات طريقٌ لا أكثر… ونحن دائماً معاً.</p>
      </div>

      <div class="success" id="success" hidden>
        <div class="ornament" aria-hidden="true">✦</div>
        <h2><span class="success-message" lang="ar">سنبقى معاً مدى الحياة يا حبيبتي، أحبكِ كثيراً. 🤍</span></h2>
        <p class="celebration" aria-label="فرحة واحتفال">💍✨🥂🤍</p>
        <button class="music-retry" id="musicRetry" type="button" hidden>تشغيل موسيقانا</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const proposal = document.getElementById("proposal");
      const success = document.getElementById("success");
      const yesButton = document.getElementById("yesButton");
      const noButton = document.getElementById("noButton");
      const ourSong = document.getElementById("ourSong");
      const musicRetry = document.getElementById("musicRetry");
      const canvas = document.getElementById("confetti");
      const context = canvas.getContext("2d");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let particles = [];
      let animationFrame = 0;

      function escapeNoButton() {
        const bounds = noButton.getBoundingClientRect();
        const yesBounds = yesButton.getBoundingClientRect();
        const styles = getComputedStyle(document.documentElement);
        const edge = (name) => Math.max(16, (parseFloat(styles.getPropertyValue(name)) || 0) + 12);
        const minX = edge("--safe-left");
        const minY = edge("--safe-top");
        const maxX = Math.max(minX, window.innerWidth - bounds.width - edge("--safe-right"));
        const maxY = Math.max(minY, window.innerHeight - bounds.height - edge("--safe-bottom"));
        let x = minX;
        let y = minY;

        for (let attempt = 0; attempt < 36; attempt += 1) {
          x = minX + Math.random() * (maxX - minX);
          y = minY + Math.random() * (maxY - minY);
          const overlapsYes = x < yesBounds.right + 12
            && x + bounds.width > yesBounds.left - 12
            && y < yesBounds.bottom + 12
            && y + bounds.height > yesBounds.top - 12;

          if (!overlapsYes) break;
        }

        if (!noButton.classList.contains("is-escaping")) document.body.append(noButton);
        noButton.classList.add("is-escaping");
        noButton.style.left = `${x}px`;
        noButton.style.top = `${y}px`;
      }

      noButton.addEventListener("touchstart", (event) => {
        event.preventDefault();
        escapeNoButton();
      }, { passive: false });

      noButton.addEventListener("pointerenter", (event) => {
        if (event.pointerType === "mouse") escapeNoButton();
      });

      noButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopImmediatePropagation();
        escapeNoButton();
      });

      window.addEventListener("resize", () => {
        if (!noButton.classList.contains("is-escaping")) return;
        const bounds = noButton.getBoundingClientRect();
        const styles = getComputedStyle(document.documentElement);
        const edge = (name) => Math.max(16, (parseFloat(styles.getPropertyValue(name)) || 0) + 12);
        const x = Math.min(Math.max(edge("--safe-left"), bounds.left), window.innerWidth - bounds.width - edge("--safe-right"));
        const y = Math.min(Math.max(edge("--safe-top"), bounds.top), window.innerHeight - bounds.height - edge("--safe-bottom"));
        noButton.style.left = `${x}px`;
        noButton.style.top = `${y}px`;
      });

      function resizeCanvas() {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(window.innerWidth * pixelRatio);
        canvas.height = Math.round(window.innerHeight * pixelRatio);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
      }

      function seekToSongMiddle() {
        if (Number.isFinite(ourSong.duration) && ourSong.duration > 0) {
          ourSong.currentTime = ourSong.duration / 2;
        }
      }

      ourSong.addEventListener("loadedmetadata", seekToSongMiddle);
      ourSong.addEventListener("error", () => {
        musicRetry.hidden = false;
      });

      function playOurSong() {
        const playback = ourSong.play();
        seekToSongMiddle();
        if (playback) {
          playback.then(() => {
            musicRetry.hidden = true;
          }).catch(() => {
            musicRetry.hidden = false;
          });
        }
      }

      function celebrate() {
        proposal.hidden = true;
        success.hidden = false;
        noButton.hidden = true;
        playOurSong();
        if (reducedMotion) return;

        const colors = ["#f5d2ec", "#c5b3ff", "#9ee6e3", "#fff1bd", "#ffffff"];
        particles = Array.from({ length: 150 }, () => ({
          x: Math.random() * window.innerWidth,
          y: -20 - Math.random() * window.innerHeight * 0.6,
          size: 3 + Math.random() * 5,
          speed: 2 + Math.random() * 4,
          drift: (Math.random() - 0.5) * 2.5,
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - 0.5) * 0.12,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 120 + Math.random() * 100
        }));

        cancelAnimationFrame(animationFrame);
        drawConfetti();
      }

      function drawConfetti() {
        context.clearRect(0, 0, window.innerWidth, window.innerHeight);
        particles = particles.filter((particle) => particle.life > 0 && particle.y < window.innerHeight + 20);
        particles.forEach((particle) => {
          particle.y += particle.speed;
          particle.x += particle.drift;
          particle.rotation += particle.spin;
          particle.life -= 1;
          context.save();
          context.translate(particle.x, particle.y);
          context.rotate(particle.rotation);
          context.fillStyle = particle.color;
          context.globalAlpha = Math.min(1, particle.life / 25);
          context.fillRect(-particle.size / 2, -particle.size / 2, particle.size, particle.size * 1.7);
          context.restore();
        });

        if (particles.length) {
          animationFrame = requestAnimationFrame(drawConfetti);
        } else {
          context.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
      }

      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);
      yesButton.addEventListener("click", celebrate, { once: true });
      musicRetry.addEventListener("click", playOurSong);
    })();
  </script>
</body>
</html>
